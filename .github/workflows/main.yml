name: REWIFY CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build and test with Gradle
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew build
    - name: Build and Push Docker Image
      if: github.event_name == 'push'
      run: |
        docker build -t felicienmukamba/rewify-backend:latest ./backend
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push felicienmukamba/rewify-backend:latest

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    - name: Lint and type-check
      run: |
        cd frontend
        npm run lint
        npx tsc --noEmit
    - name: Build Next.js
      run: |
        cd frontend
        npm run build
    - name: Build and Push Docker Image
      if: github.event_name == 'push'
      run: |
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8080/api/v1' }} \
          --build-arg NEXT_PUBLIC_WS_URL=${{ vars.PUBLIC_WS_URL || 'http://localhost:8080/ws' }} \
          -t felicienmukamba/rewify-frontend:latest ./frontend
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push felicienmukamba/rewify-frontend:latest
