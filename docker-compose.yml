services:
  postgres:
    image: postgres:16-alpine
    container_name: rewify-db
    environment:
      POSTGRES_DB: rewify
      POSTGRES_USER: ${POSTGRES_USER:-rewify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rewify}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rewify} -d rewify"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rewify-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rewify
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rewify}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rewify}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Optional: AI question generation & moderation
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional: live video
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-http://localhost:8080/ws}
    container_name: rewify-ui
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
