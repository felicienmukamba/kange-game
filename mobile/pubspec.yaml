name: rewify
description: "REWIFY — jeux sociaux, multijoueur temps réel et live streaming."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  bloc: ^9.2.1
  chess: ^0.8.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  livekit_client: ^2.13.1
  permission_handler: ^13.0.2
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  stomp_dart_client: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/content/

