apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewify-frontend
  labels:
    app: rewify-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rewify-frontend
  template:
    metadata:
      labels:
        app: rewify-frontend
    spec:
      containers:
      - name: frontend
        image: felicienmukamba/rewify-frontend:latest
        ports:
        - containerPort: 3000
        # NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL are baked in at image build time:
        #   docker build --build-arg NEXT_PUBLIC_API_URL=https://api.rewify.app/api/v1 \
        #                --build-arg NEXT_PUBLIC_WS_URL=https://api.rewify.app/ws ./frontend
---
apiVersion: v1
kind: Service
metadata:
  name: rewify-frontend
spec:
  selector:
    app: rewify-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
