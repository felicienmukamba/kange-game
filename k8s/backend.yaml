apiVersion: apps/v1
kind: Deployment
metadata:
  name: rewify-backend
  labels:
    app: rewify-backend
spec:
  # Game rooms and the STOMP broker are in-memory: keep a single replica until
  # they move to an external broker (e.g. RabbitMQ STOMP relay) and shared state.
  replicas: 1
  selector:
    matchLabels:
      app: rewify-backend
  template:
    metadata:
      labels:
        app: rewify-backend
    spec:
      containers:
      - name: backend
        image: felicienmukamba/rewify-backend:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: rewify-config
        - secretRef:
            name: rewify-secrets
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: rewify-backend
spec:
  selector:
    app: rewify-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
